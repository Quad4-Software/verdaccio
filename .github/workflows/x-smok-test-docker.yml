on:
  workflow_call:
    inputs:
      docker_tag:
        required: true
        type: string
        description: 'Docker tag to use for the verdaccio image'
        default: '5'
      module_tag:
        required: true
        type: string
        description: 'Npmjs module tag to use for the verdaccio image'
        default: '@latest'   
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Docker test
        run: |
            docker run -d -it --rm --name verdaccio -p 4873:4873 verdaccio/verdaccio:${INPUTS_DOCKER_TAG}
        env:
          INPUTS_DOCKER_TAG: ${{ inputs.docker_tag }}
      - name: verdaccio cli 
        run:  npm install -g verdaccio${INPUTS_MODULE_TAG} --registry http://localhost:4873
        env:
          INPUTS_MODULE_TAG: ${{inputs.module_tag }}                        
      - name: gastby cli 
        run:  npm install -g gatsby-cli --registry http://localhost:4873
      - name: netlify cli 
        run:  npm install -g netlify-cli --registry http://localhost:4873
      - name: angular cli 
        run:  npm install -g @angular/cli --registry http://localhost:4873
