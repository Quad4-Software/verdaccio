name: Docker publish to docker.io and ghcr.io

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    # Gate the master-branch (nightly) publish behind the `docker` environment,
    # which requires manual approval. Tag-triggered (v*) releases get an empty
    # environment, so they run without the gate (and aren't blocked by the
    # master-only branch policy).
    environment: ${{ github.ref == 'refs/heads/master' && 'docker' || '' }}
    permissions:
      contents: read
      # pushes to ghcr.io with the workflow token
      packages: write
      # cosign keyless signing needs an OIDC token
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fetch UI translations before `COPY . .`, else the image ships an
      # English-only UI (ui-theme bundles them from gitignored download_translations/).
      - name: Install dependencies
        uses: ./.github/actions/install-app

      - name: crowdin download
        env:
          # download-only token, exposed under the name crowdin.yaml expects
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: |
            if [ -z "$CROWDIN_VERDACCIO_API_KEY" ]; then
              echo "::notice::CROWDIN_VERDACCIO_API_KEY not set; skipping crowdin:download"
            else
              pnpm crowdin:download
            fi

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image tags
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && github.repository || '' }}
          tags: |
            type=raw,value=nightly-master,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          # metadata-action generates the org.opencontainers.image.* label set
          # (created, source, revision, version, url, licenses) from the event
          # context; no manual labels needed

      - name: Build & Push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # sign the multi-arch manifest digest on every registry it was pushed to
      - name: Sign image digests
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGES: ghcr.io/${{ github.repository }}${{ steps.dockerhub.outputs.enabled == 'true' && format(' {0}', github.repository) || '' }}
        run: |
          for image in $IMAGES; do
            cosign sign --yes "${image}@${DIGEST}"
          done
