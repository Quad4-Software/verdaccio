packages:
  - packages/*
  - packages/core/*
  - packages/tools/*
  - packages/ui/*
  - packages/server/*
  - packages/logger
  - packages/plugins/audit
  - packages/plugins/auth-memory
  - packages/plugins/htpasswd
  - packages/plugins/ui-theme
  - packages/plugins/memory
  - packages/plugins/local-storage
  - packages/plugins/oidc
  - packages/plugins/package-filter
  - e2e/cli/*
allowBuilds:
  '@parcel/watcher': true
  cypress: true
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAge: 10080
# pnpm 12 auto-adds new direct dependencies to minimumReleaseAgeExclude instead
# of blocking them; strict keeps the pnpm 11 behavior (fail on immature versions)
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@verdaccio/*'
  - '@verdaccio-scope/*'
  - 'verdaccio-*'
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

# Force the esbuild security patch (>= 0.28.1) across the whole tree.
# See GHSA-gv7w-rqvm-qjhr (RCE via NPM_CONFIG_REGISTRY, fixed in 0.28.1).
overrides:
  esbuild: '0.28.2'
  # Force the form-data CRLF-injection patch (>= 4.0.6) across the whole tree.
  # Pulled in transitively via supertest > superagent (dev only).
  # See GHSA-hmw2-7cc7-3qxx (fixed in 4.0.6).
  form-data: '>=4.0.6'
  # Force fixes for fast-uri URL normalization vulnerabilities.
  # Pulled in transitively via ajv (production dependency).
  # See GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # and GHSA-jqff-g426-hqxp (fixed in 3.1.6).
  fast-uri: '3.1.6'
  # Express 5.2.1 still pins vulnerable transitives; force the patches.
  # qs DoS (GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g,
  # fixed in 6.16.0), body-parser limit bypass (GHSA-v422-hmwv-36x6, 2.3.0),
  # path-to-regexp ReDoS (GHSA-27v5-c462-wpq7, 8.4.0).
  # Scoped to express: msw needs its own older path-to-regexp for wildcard
  # route matching.
  'express@5>qs': '>=6.16.0'
  'express@5>body-parser': '>=2.3.0'
  'express@5>path-to-regexp': '>=8.4.0'
  # yaml stack overflow via nested collections (GHSA-48c2-rrv3-qjmp, 1.10.3)
  # and mdast-util-to-hast class attribute injection (GHSA-4fh9-h7wg-q85m, 13.2.1).
  yaml: '>=1.10.3'
  mdast-util-to-hast: '>=13.2.1'
saveExact: true
ignoreScripts: true
preferFrozenLockfile: true

auditConfig:
  ignoreGhsas:
    # Express.js unreleased
    - GHSA-j3q9-mxjg-w52f
    # Express.js unreleased
    - GHSA-w7fw-mjwx-w883
    # brace-expansion DoS; fixed in 5.0.8 (published 2026-07-23) which is still
    # inside the 7-day minimumReleaseAge quarantine. Remove this ignore and
    # update the lockfile after 2026-07-30.
    - GHSA-mh99-v99m-4gvg
