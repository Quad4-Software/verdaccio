storage: ./storage

auth:
  htpasswd:
    file: ./htpasswd

packages:
  '@token/*':
    access: $authenticated
    publish: $authenticated
  'only-you-can-publish':
    access: $authenticated
    publish: $authenticated

log: { type: stdout, format: pretty, level: debug }

security:
  api:
    jwt:
      sign:
        expiresIn: 5m
        notBefore: 0
      verify: {}
  trustedPublishing:
    - provider: github
      repository: acme/widgets
      workflow: release.yml
      issuer: https://issuer.test
      # the spec rewrites this to the local JWKS stub
      jwksUri: http://127.0.0.1:0/jwks
      # audience must be configured: falling back to the Host header would
      # accept tokens minted for any registry
      audience: npm:127.0.0.1
      packages:
        - '@token/*'
      user: ci-bot
    - provider: gitlab
      repository: acme/gitlab-proj
      workflow: .gitlab-ci.yml
      issuer: https://gitlab.test
      jwksUri: http://127.0.0.1:0/jwks
      environment: production
      audience: npm:127.0.0.1
      packages:
        - '@token/gitlab-*'
      user: ci-bot
